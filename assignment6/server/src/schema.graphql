enum GameStatus {
    PENDING
    ACTIVE
    FINISHED
}

enum Color {
    BLUE
    RED
    GREEN
    YELLOW
}

type NamedColor {
    playerId: Int!
    color: Color!
}

type RoundResult {
    roundsPlayed: Int!
    winner: Int!
    addedScore: Int!
}

type Card {
    type: String!
    color: Color
    number: Int
}

type Player {
    playerId: Int!
    playerName: String!
    hand: [Card!]!
    hasSaidUno: Boolean!
    hasDrawnCardInTurn: Boolean!
}

type Round {
    players: [Player!]!
    dealer: Player!
    drawPile: [Card!]!
    discardPile: [Card!]!
    activeCardColor: Color!
    activePlayer: Player
    playPassDirection: String!
    noOfCardsPlayerMustDraw: Int!
    skipNextPlayer: Boolean!
}

type Game {
    id: ID!
    name: String!
    joinedPlayers: [String!]!
    status: GameStatus!
    version: Int!
    namedColor: NamedColor
    lastRound: RoundResult
    playerNames: [String!]!
    currentRound: Round
    targetScore: Int!
    scores: [Int!]!
    cardsPerPlayer: Int!
    winner: Player
}

type Query {
    game(name: String!, password: String!): Game
}

type Mutation {
    hostGame(name: String!, password: String!, playerCount: Int!, targetScore: Int!, hostPlayerName: String!): Game!
    joinGame(name: String!, password: String!, playerName: String!): Game!
    startGame(name: String!, password: String!): Game!

    play(name: String!, password: String!, playerId: Int!, cardIndex: Int!, namedColor: Color): Game!
    draw(name: String!, password: String!, playerId: Int!): Game!
    sayUno(name: String!, password: String!, playerId: Int!): Game!
    catchUno(name: String!, password: String!, playerId: Int!): Game!
}

type Subscription {
    gameUpdated(name: String!, password: String!): Game!
}
