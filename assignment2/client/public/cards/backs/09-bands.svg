    <rect x="20" y="100" width="200" height="40" fill="#ffaa00"/>
    <rect x="20" y="140" width="200" height="40" fill="#55aa55"/>
    <rect x="20" y="180" width="200" height="40" fill="#55aa55"/>
    <rect x="20" y="220" width="200" height="40" fill="#ffaa00"/>
    <rect x="20" y="260" width="200" height="40" fill="#5555ff"/>
    <rect x="20" y="300" width="200" height="40" fill="#ff5555"/>
