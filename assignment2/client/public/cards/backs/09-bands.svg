<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="244" height="364" viewBox="-2 -2 244 364">
  <title>Card back, color bands</title>
  <rect x="0" y="0" width="240" height="360" rx="40" ry="40" fill="#ffffff" stroke="#000000" stroke-width="2"/>
