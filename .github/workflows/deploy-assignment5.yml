# 100% AI generated!
# Deploys assignment 5 to its own Azure App Service, whenever something in assignment5/ changes on main.
# It can also be started by hand from the Actions page: open "Deploy assignment 5" and choose "Run workflow".
#
# Needs two settings in the GitHub repository (Settings > Secrets and variables > Actions):
#   variable  AZURE_WEBAPP_NAME_ASSIGNMENT5       the name of the App Service
#   secret    AZURE_PUBLISH_PROFILE_ASSIGNMENT5   the content of the publish profile downloaded from that App Service
#
# The App Service also needs MONGODB_DATABASE set to a database of its own (such as uno-assignment5), if it is
# given the same MONGODB_URI as assignment 3; otherwise both assignments would share the uno-assignment3 games.
name: Deploy assignment 5

on:
  push:
    branches: [main]
    paths:
      - 'assignment5/**'
      - '.github/workflows/deploy-assignment5.yml'
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-to-azure.yml
    with:
      assignment: assignment5
      app-name: ${{ vars.AZURE_WEBAPP_NAME_ASSIGNMENT5 }}
    secrets:
      publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_ASSIGNMENT5 }}
